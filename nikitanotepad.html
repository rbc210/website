<!DOCTYPE html>
<html lang="en">
<head>
    <!-- meta tag -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 5b - Forms</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Semantic Tag: header -->
    <header class="site-header">
        <h1>User Registration Form</h1>
    </header>

    <!-- Semantic Tag: main -->
    <main class="main-container">
        <form action="#" method="post" enctype="multipart/form-data" class="custom-form">

            <!-- Grouping form elements using Fieldset & Legend -->
            <fieldset class="form-section">
                <legend class="section-title">Personal Details</legend>

                <div class="form-group">
                    <label for="user-email">Email Address (Required):</label>
                    <!-- Email input with validation -->
                    <input type="email" id="user-email" name="user_email" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="user-tel">Phone Number (Required):</label>
                    <!-- Tel input with validation -->
                    <input type="tel" id="user-tel" name="user_tel" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="user-dob">Date of Birth (Required):</label>
                    <!-- Date input with validation -->
                    <input type="date" id="user-dob" name="user_dob" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="website-url">Website URL (Required):</label>
                    <!-- URL input with validation -->
                    <input type="url" id="website-url" name="website_url" required class="input-field">
                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend class="section-title">Preferences & Uploads</legend>

                <div class="form-group">
                    <label for="skills">Select Skills (Multiple Select Dropdown):</label>
                    <!-- Dropdown (multiple select) -->
                    <select id="skills" name="skills" multiple class="select-field">
                        <option value="html">HTML5</option>
                        <option value="css">CSS3</option>
                        <option value="js">JavaScript</option>
                        <option value="react">React</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="theme-color">Preferred Color:</label>
                    <!-- Color input -->
                    <input type="color" id="theme-color" name="theme_color" value="#007bff" class="color-picker">
                </div>

                <div class="form-group">
                    <label for="experience">Experience Level (Range Input):</label>
                    <!-- Range input -->
                    <input type="range" id="experience" name="experience" min="0" max="10" class="range-slider">
                </div>

                <div class="form-group">
                    <label for="resume">Upload Document (File Upload):</label>
                    <!-- File upload -->
                    <input type="file" id="resume" name="resume" class="file-input">
                </div>
            </fieldset>

            <div class="button-group">
                <!-- Submit button -->
                <button type="submit" class="btn btn-submit">Submit Form</button>

                <!-- Image button -->
                <input type="image" src="https://via.placeholder.com/100x40?text=Submit" alt="Submit Image Button" class="img-button">
            </div>

        </form>
    </main>

    <!-- Semantic Tag: footer -->
    <footer class="site-footer">
        <p>&copy; Front End Web Development & Design</p>
    </footer>

</body>
</html>
